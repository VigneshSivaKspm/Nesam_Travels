<!doctype html>
<html lang="en-IN" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Per-page title, description, robots, canonical, share tags and JSON-LD.
         Filled from src/seo/ by scripts/seo-prerender.ts (dev server and build) — edit there, not here. -->
    <!--seo:head--><!--/seo:head-->
    <meta name="author" content="NESAM Tours and Travels Private Limited" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />

    <!-- Local & Geo Targeting Meta Tags (Tamil Nadu, South India) -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Theni, Tamil Nadu, India" />
    <meta name="geo.position" content="10.0104;77.4768" />
    <meta name="ICBM" content="10.0104, 77.4768" />
    <meta name="coverage" content="Tamil Nadu, Puducherry, Karnataka, Kerala, Andhra Pradesh" />
    <meta name="distribution" content="Global" />
    <meta name="rating" content="General" />

    <!-- Mobile App & PWA Settings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="One Way Car Rentals" />
    <meta name="application-name" content="One Way Car Rentals" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Share cards: the per-page parts are in the seo:head block above -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="One Way Car Rentals" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons & Manifest -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png" />

    <!-- Preconnect & DNS-Prefetch for Speed / Core Web Vitals -->
    <link rel="preconnect" href="https://router.project-osrm.org" crossorigin />
    <link rel="preconnect" href="https://photon.komoot.io" crossorigin />
    <link rel="dns-prefetch" href="https://router.project-osrm.org" />
    <link rel="dns-prefetch" href="https://photon.komoot.io" />

    <style>
      /* Startup placeholder, shown before the app bundle runs: the same light header and booking
         home layout as the app, so nothing dark or unrelated flashes first. React replaces it. */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f5f6f4;
        color: #29322d;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow-x: clip;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .boot {
        min-height: 100vh;
        min-height: 100dvh;
        background: linear-gradient(180deg, #e9f6ee 0, #f5f6f4 560px);
      }
      .boot__bar {
        height: 72px;
        border-bottom: 1px solid #e2e6e2;
        background: #fff;
      }
      .boot__wrap {
        width: 100%;
        padding-inline: clamp(14px, 2.8vw, 64px);
      }
      .boot__bar .boot__wrap {
        display: flex;
        align-items: center;
        height: 100%;
      }
      .boot__bar img {
        display: block;
        width: auto;
        height: 40px;
      }
      .boot__hero {
        display: flex;
        flex-direction: column;
        gap: clamp(20px, 3vw, 32px);
        max-width: 1180px;
        margin-inline: auto;
        padding-block: clamp(20px, 4vw, 48px);
      }
      .boot__title {
        display: grid;
        gap: 12px;
      }
      .boot__card {
        display: grid;
        gap: 14px;
        padding: clamp(20px, 2.5vw, 36px);
        border: 1px solid #ccd3ce;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 12px 36px -8px rgb(13 138 69 / 0.12), 0 4px 18px rgb(0 0 0 / 0.04);
      }
      .boot__tabs {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .boot__row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .sk {
        display: block;
        border-radius: 10px;
        background: linear-gradient(100deg, #eceeeb 30%, #f8f9f7 50%, #eceeeb 70%) 0 0 / 220% 100%;
        animation: boot-shimmer 1.3s linear infinite;
      }
      .sk--title { width: min(100%, 460px); height: clamp(32px, 6vw, 52px); }
      .sk--tab { height: 48px; }
      .sk--field { height: 64px; }
      .sk--go { height: 54px; background: #0d8a45; animation: none; }
      @keyframes boot-shimmer {
        to { background-position: -220% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk { animation: none; }
      }
      @media (max-width: 999.98px) {
        .boot__bar { height: 56px; }
        .boot__bar img { height: 36px; }
      }
      @media (max-width: 599.98px) {
        .boot__tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .boot__row { grid-template-columns: 1fr; }
      }

      /* Plain-HTML page summary shown when JavaScript is off (filled by the build per page) */
      .seo-js-note {
        margin: 0;
        padding: 16px;
        background: #fff3cd;
        color: #5c4500;
        font-weight: 500;
        text-align: center;
      }
      .seo-static {
        max-width: 1140px;
        margin: 0 auto;
        padding: 32px 24px 48px;
        color: #1a1a1a;
        line-height: 1.6;
      }
      .seo-static nav ul {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        padding: 0;
        list-style: none;
      }
      .seo-static a { color: #0a6a34; }
      .seo-static h1 { font-size: 2.2rem; line-height: 1.25; }
      .seo-static h2 { margin-top: 32px; font-size: 1.5rem; }
      .seo-static h3 { margin-top: 20px; font-size: 1.15rem; }
      .seo-static li { margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <!-- Readable page summary for visitors and crawlers without JavaScript (filled per page at build) -->
    <noscript><style>.boot { display: none; }</style><!--seo:body--><!--/seo:body--></noscript>

    <!-- React root container with the startup placeholder (see the style block above) -->
    <div id="root">
      <div class="boot" aria-busy="true">
        <span class="sr-only" role="status">Loading One Way Car Rentals…</span>
        <header class="boot__bar">
          <div class="boot__wrap">
            <img src="/brand/one-way-car-rentals-logo.png" alt="One Way Car Rentals" width="120" height="40" />
          </div>
        </header>
        <div class="boot__wrap" aria-hidden="true">
          <div class="boot__hero">
            <div class="boot__title">
              <span class="sk sk--title"></span>
              <span class="sk sk--title"></span>
            </div>
            <div class="boot__card">
              <div class="boot__tabs">
                <span class="sk sk--tab"></span>
                <span class="sk sk--tab"></span>
                <span class="sk sk--tab"></span>
                <span class="sk sk--tab"></span>
              </div>
              <div class="boot__row">
                <span class="sk sk--field"></span>
                <span class="sk sk--field"></span>
              </div>
              <span class="sk sk--go"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- reCAPTCHA container for phone auth -->
    <div id="recaptcha-container"></div>

    <!-- Main JavaScript entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
