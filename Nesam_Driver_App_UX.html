.trip-flow .nx-trip-help.nx-trip-help-top{margin:0;max-width:205px;border:1px solid var(--nx-line);border-radius:9px;padding:8px 10px;background:white;color:var(--nx-ink);text-align:left;font-size:11px;font-weight:600;line-height:1.45;gap:7px}
.trip-flow .nx-trip-help-top .icon{flex-shrink:0;color:var(--nx-red);width:16px;height:16px}
.trip-flow .nx-trip-help-top:focus-visible{outline:2px solid var(--nx-red);outline-offset:3px}
.nx-help-intro{font-size:13px;line-height:1.7;color:var(--ink);margin:0 0 14px}
.nx-help-choice.nx-request-choice{border:1px solid var(--line);border-radius:11px;background:var(--page);padding:14px 12px}
.nx-request-choice>span>.icon{color:var(--red)}
.nx-help-rules{padding-left:18px;margin:15px 0 5px;color:var(--muted);font-size:12px;line-height:1.75}
.nx-help-rules li{margin:0 0 8px}
.nx-office-call{min-height:46px}
.nx-office-number{margin:0;color:var(--ink);font-size:13px;font-weight:600;text-align:center;letter-spacing:.3px}
.nx-office-note{margin:0;color:var(--muted);font-size:11px;line-height:1.6;text-align:center}
.nx-cancel-explain strong{display:block;color:var(--ink);font-weight:600;margin-bottom:5px}

/* NESAM brand signature: original symbol, consistent wordmark, quiet product label. */
.nesam-brand{--nesam-signature-red:#e43d32;display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.nesam-brand .nesam-symbol{position:relative;display:block;overflow:hidden;width:44px;height:44px;flex:0 0 44px;background:#fff}
.nesam-brand .nesam-symbol .real-logo{position:absolute;display:block;left:-13.57%;top:-11.95%;width:127.45%;height:auto;max-width:none;min-width:0;object-fit:fill;mix-blend-mode:normal}
.nesam-brand .nesam-brand-text{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;padding-top:1px}
.nesam-brand .nesam-brand-text .brand-name,.topbar .mobile-brand.nesam-brand .brand-name{font-family:"NESAM Wordmark",Arial,sans-serif;font-size:24px;font-weight:900;font-style:normal;letter-spacing:1.5px;line-height:1;color:var(--nesam-signature-red);white-space:nowrap;text-rendering:geometricPrecision}
.nesam-brand .nesam-brand-text .brand-label,.topbar .mobile-brand.nesam-brand .brand-label{display:block;padding:0 0 0 1px;margin:6px 0 0;font-family:Arial,"Helvetica Neue",sans-serif;font-size:9px;font-weight:700;letter-spacing:3.3px;line-height:1.1;color:#454b54;white-space:nowrap}
.nesam-brand .brand-label:before{content:none;display:none}
.sidebar .nesam-brand{gap:10px;margin:0 5px 40px}
.topbar .mobile-brand.nesam-brand{gap:10px}
@media(max-width:700px){.topbar{min-height:74px;padding-top:14px;padding-bottom:14px;gap:12px;background:#fff}.topbar>div:first-child{min-width:0}.topbar .header-actions{flex-shrink:0;gap:7px}.topbar .mobile-brand.nesam-brand .brand-name{font-size:23px;letter-spacing:1.35px}.topbar .mobile-brand.nesam-brand .brand-label{font-size:9px;letter-spacing:3px;margin-top:6px}}
@media(max-width:360px){.topbar{min-height:69px;padding-top:12px;padding-bottom:12px;gap:8px}.topbar .mobile-brand.nesam-brand{gap:9px}.nesam-brand .nesam-symbol{width:40px;height:40px;flex-basis:40px}.topbar .mobile-brand.nesam-brand .brand-name{font-size:22px;letter-spacing:1.1px}.topbar .mobile-brand.nesam-brand .brand-label{letter-spacing:2.8px;margin-top:5px}.topbar .header-actions{gap:5px}}

fo')}For document updates, contact the NESAM office.</div></section></div>`;}

    function freshState(){return{online:true,assigned:[DUTIES[0].id],notificationsRead:false,notificationsEnabled:true,flows:{},clock:Date.parse('2026-10-19T08:00:00+05:30')};}
    function blankFlow(){return{stage:0,otpVerified:false,selfieAt:null,carAt:null,km:'',closedAt:null,acceptedAt:null,cancellation:null};}
    function getFlow(id){if(!state.flows[id])state.flows[id]=blankFlow();if(!Number.isFinite(state.flows[id].acceptedAt))state.flows[id].acceptedAt=id===DUTIES[0].id?Date.parse('2026-10-18T18:00:00+05:30'):state.clock;return state.flows[id];}
    function calculateTrip(d,f){
      if(f.km==='')return null;
      const actualKm=Number(f.km),includedKm=Number(d.km),bookedFare=Number(d.bookedFare??(d.km*15+500)),online=Number(d.paidOnline||0),advance=Number(d.confirmedAdvance||0),extraRate=Number(d.extraKmRate??15),extraGstPercent=Number(d.extraGstPercent??5);
      if(![actualKm,includedKm,bookedFare,online,advance,extraRate,extraGstPercent].every(Number.isFinite)||actualKm<=0||actualKm>10000||Math.abs(actualKm*10-Math.round(actualKm*10))>0.000001||includedKm<=0||[bookedFare,online,advance,extraRate,extraGstPercent].some(x=>x<0))return null;
      // The booked fare is already GST-inclusive. GST is added only to extra KM.
      // Production quotes, rates and confirmed payment records must come from the server.
      const extraTenths=Math.max(0,Math.round(actualKm*10)-Math.round(includedKm*10)),extraKm=extraTenths/10,extraBase=Math.round(extraTenths*Math.round(extraRate*100)/10),extraTax=Math.round(extraBase*extraGstPercent/100),baseFare=Math.round(bookedFare*100),total=baseFare+extraBase+extraTax;
      const paidOnline=d.onlinePaymentVerified===true?Math.round(online*100):0,confirmedAdvance=Math.round(advance*100),paid=paidOnline+confirmedAdvance,paymentNeedsReview=online>0&&d.onlinePaymentVerified!==true;
      return{actualKm,includedKm,extraKm,extraBase,extraTax,baseFare,total,paidOnline,confirmedAdvance,paid,paymentNeedsReview,amountToCollect:paymentNeedsReview?null:Math.max(0,total-paid),refund:Math.max(0,paid-total)};
    }
    function sanitizeFlow(d,raw){
      const f=blankFlow();f.acceptedAt=d.id===DUTIES[0].id?Date.parse('2026-10-18T18:00:00+05:30'):Date.parse('2026-10-19T08:00:00+05:30');if(!raw||typeof raw!=='object')return f;
      if(Number.isFinite(raw.acceptedAt)&&raw.acceptedAt>0)f.acceptedAt=raw.acceptedAt;
      f.stage=Number.isInteger(raw.stage)&&raw.stage>=0&&raw.stage<=6?raw.stage:0;
      f.otpVerified=raw.otpVerified===true;
      if(f.stage>0){f.selfieAt=Number.isFinite(raw.selfieAt)&&raw.selfieAt>0?raw.selfieAt:null;f.carAt=Number.isFinite(raw.carAt)&&raw.carAt>0?raw.carAt:null;if(!f.selfieAt||!f.carAt){f.stage=0;f.otpVerified=false;}}

      f.closedAt=Number.isFinite(raw.closedAt)?raw.closedAt:null;
      if(f.stage>=3&&!f.otpVerified)f.stage=2;
      const bill=calculateTrip(d,f);

      if(f.stage===0&&c&&['pending','approved','declined'].includes(c.status)&&['vehicle','health','emergency','other'].includes(c.reason)&&[c.requestedAt,c.acceptedAt,c.pickupAt].every(Number.isFinite)&&c.requestedAt>=c.acceptedAt&&[0,500,1000].includes(c.quotedPenalty)){

        if(c.status==='approved'&&f.cancellation.finalPenalty===null)f.cancellation.status='pending';
      }
      return f;
    }
    function restoreState(){
      const base=freshState();try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!raw||typeof raw!=='object')return base;
        base.online=typeof raw.online==='boolean'?raw.online:true;base.notificationsRead=raw.notificationsRead===true;base.notificationsEnabled=raw.notificationsEnabled!==false;
        base.assigned=Array.isArray(raw.assigned)?[...new Set(raw.assigned.filter(id=>DUTIES.some(d=>d.id===id)))]:base.assigned;
        if(!base.assigned.includes(DUTIES[0].id))base.assigned.unshift(DUTIES[0].id);
        if(Number.isFinite(raw.clock)&&raw.clock>=base.clock&&raw.clock<=Date.parse('2026-10-23T23:59:59+05:30'))base.clock=raw.clock;
        let active=false;for(const d of DUTIES){if(base.assigned.includes(d.id)){const f=sanitizeFlow(d,raw.flows?.[d.id]);if(f.stage>0&&f.stage<6){if(active)Object.assign(f,blankFlow());else active=true;}base.flows[d.id]=f;}}
        return base;
      }catch{return base;}
    }

    function separateChargesNote(){return `<div class="nx-separate-note">${icon('info')}<p><strong>Toll, parking & state tax are extra</strong><span>Collect separately against actual receipts. These are excluded from this amount.</span></p></div>`;}

    function commitTripSwipe(action){const d=DUTIES.find(x=>x.id===activeTripId);if(!d||!state.assigned.includes(d.id))return false;const f=getFlow(d.id);if(isCancelled(f)||cancellationPending(f))return false;if(action==='begin'&&f.stage===0){if(!startReady(d)||!hasStartPhotos(d.id))return false;stepTo(1);return true;}if(action==='reach'&&f.stage===1&&Number(d.pickupKm)<=3){stepTo(2);return true;}if(action==='end'&&f.stage===3&&f.otpVerified){stepTo(4);return true;}return false;}
    function bindTripSliders(){

    function photoRecord(id){if(!livePhotos.has(id))livePhotos.set(id,{});return livePhotos.get(id);}
    function hasStartPhotos(id){const photos=livePhotos.get(id);return Boolean(photos?.selfie?.src&&photos?.car?.src);}
    function startReady(d){return !isCancelled(getFlow(d.id))&&!cancellationPending(getFlow(d.id))&&state.clock>=Date.parse(d.start)&&!assignedDuties().some(x=>x.id!==d.id&&getFlow(x.id).stage>0);}
    function stopCamera(){cameraGeneration++;cameraOpening=false;cameraReady=false;if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;}const video=document.getElementById('driver-camera-video');if(video)video.srcObject=null;}
    function startTripChecks(d,f){const photos=photoRecord(d.id),ready=startReady(d);return `<section class="nx-panel nx-start-checks"><span class="badge green">${icon('check')}Confirmed duty</span><h3 class="nx-heading" style="margin-top:15px">Before you start</h3><p class="nx-copy">Take two live photos to start this duty.</p><div class="nx-pickup-summary">${icon('pin')}<div><small>Pickup</small><strong>${d.pickup}</strong></div></div><div class="nx-photo-checks">${[['selfie','Live selfie','Keep your face clearly visible.','user'],['car','Car front photo','Include the full front and number plate.','car']].map(([kind,title,copy,ico],i)=>`<div class="nx-photo-check ${photos[kind]?'is-captured':''}"><div class="nx-photo-thumb">${photos[kind]?`<img src="${photos[kind].src}" alt="Captured ${kind==='selfie'?'driver selfie':'car front'}">`:icon(ico)}</div><div class="nx-photo-copy"><small>STEP ${i+1}</small><strong>${title}</strong><p>${photos[kind]?'Captured live':copy}</p></div><button type="button" class="nx-photo-action" data-action="camera-open" data-kind="${kind}" ${!ready||(kind==='car'&&!photos.selfie)?'disabled':''}>${photos[kind]?'Retake':'Take photo'}${photos[kind]?icon('check'):''}</button></div>`).join('')}</div><p class="nx-camera-only">${icon('shield')}Live camera only · Gallery upload unavailable</p>${swipeMarkup('begin','Slide to Start Trip',!ready||!hasStartPhotos(d.id))}${!ready?`<p class="nx-note">${state.clock<Date.parse(d.start)?'Available on '+d.date+' at '+d.time+' IST.':'Finish your active trip before starting this duty.'}</p>`:!hasStartPhotos(d.id)?'<p class="nx-note">Complete both photo checks to unlock Start Trip.</p>':''}</section>`;}
    function cameraPage(){const selfie=cameraKind==='selfie',title=selfie?'Take a live selfie':'Capture car front';return `<div class="trip-flow nx-camera-page"><button type="button" class="trip-back" data-action="camera-back">${icon('chevron')}Trip checks</button><div class="nx-camera-top"><span class="nx-eyebrow">${selfie?'Step 1':'Step 2'} of 2</span><span class="nx-live-badge"><span></span>${cameraImage?'Captured live':'Live camera'}</span></div><h2 class="nx-route-title">${title}</h2><p class="nx-copy" style="margin-top:8px">${selfie?'Look straight at the camera. Keep your full face inside the guide.':'Keep the cab’s full front and registration plate inside the frame.'}</p><div class="nx-camera-frame ${selfie?'is-selfie':'is-car'}">${cameraImage?`<img class="nx-camera-result" src="${cameraImage.src}" alt="${selfie?'Selfie':'Car front'} captured from the live camera">`:`<video id="driver-camera-video" autoplay playsinline muted aria-label="Live ${selfie?'selfie':'car front'} camera"></video><div class="nx-camera-placeholder" id="driver-camera-placeholder">${icon(selfie?'user':'car')}<span>Live ${selfie?'selfie':'car front'} camera</span></div><div class="nx-camera-guide" aria-hidden="true"></div>`}</div><p class="nx-camera-message" id="driver-camera-message" role="status">${cameraImage?'Check that the photo is clear before continuing.':'Camera access is required. Photos cannot be selected from your gallery.'}</p><div class="nx-form-error" id="driver-camera-error" role="alert">${esc(cameraError)}</div><div class="nx-actions">${cameraImage?`<button class="nx-button primary" type="button" data-action="camera-use">${selfie?'Use selfie & continue':'Use car photo'} ${icon('check')}</button><button class="nx-button" type="button" data-action="camera-retake">Retake live photo</button>`:`<button class="nx-button primary" type="button" id="driver-camera-capture" data-action="camera-capture" disabled>Capture ${selfie?'selfie':'car front'} ${icon('check')}</button><button class="nx-button" type="button" id="driver-camera-open" data-action="camera-retry">Open camera</button>`}</div><p class="nx-camera-only">${icon('shield')}Camera only · No gallery upload</p></div>`;}
    function setCameraError(message){cameraError=message;const error=document.getElementById('driver-camera-error');if(error)error.textContent=message;}
    async function openLiveCamera(kind){
      const d=DUTIES.find(x=>x.id===activeTripId);if(!d||getFlow(d.id).stage!==0||!startReady(d)||!['selfie','car'].includes(kind)||(kind==='car'&&!photoRecord(d.id).selfie))return;
      stopCamera();cameraKind=kind;cameraImage=null;cameraError='';page='camera';render(true);
      if(!navigator.mediaDevices?.getUserMedia||window.isSecureContext===false){setCameraError('Live camera is unavailable here. Open this app in a camera-enabled browser and allow camera access.');return;}
      const token=++cameraGeneration,dutyId=d.id;cameraOpening=true;
      const opener=document.getElementById('driver-camera-open');if(opener){opener.disabled=true;opener.textContent='Opening camera…';}
      document.getElementById('driver-camera-message').textContent='Allow camera access to continue.';
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:kind==='selfie'?'user':'environment'},width:{ideal:1280},height:{ideal:960}}});
        if(token!==cameraGeneration||page!=='camera'||activeTripId!==dutyId){stream.getTracks().forEach(track=>track.stop());return;}
        cameraStream=stream;cameraOpening=false;
        const video=document.getElementById('driver-camera-video');if(!video){stopCamera();return;}
        video.srcObject=stream;video.muted=true;video.playsInline=true;
        const ready=()=>{if(token!==cameraGeneration||page!=='camera'||video.srcObject!==stream||!video.videoWidth||!video.videoHeight||video.readyState<2)return;cameraReady=stream.getVideoTracks().some(track=>track.readyState==='live');document.getElementById('driver-camera-capture').disabled=!cameraReady;document.getElementById('driver-camera-placeholder').hidden=cameraReady;document.getElementById('driver-camera-message').textContent=kind==='selfie'?'Camera ready. Keep your face inside the guide.':'Camera ready. Show the cab’s full front and number plate.';if(opener){opener.disabled=false;opener.textContent='Restart camera';}};
        video.addEventListener('loadeddata',ready);video.addEventListener('playing',ready);
        stream.getVideoTracks().forEach(track=>track.addEventListener('ended',()=>{if(token!==cameraGeneration)return;stopCamera();const capture=document.getElementById('driver-camera-capture');if(capture)capture.disabled=true;setCameraError('Camera stopped. Open the camera again to take a live photo.');if(opener){opener.disabled=false;opener.textContent='Open camera';}}));
        await video.play();ready();
      }catch(error){if(token!==cameraGeneration)return;stopCamera();const messages={NotAllowedError:'Camera access is blocked. Allow camera permission in your browser, then try again.',NotFoundError:'No camera was found. Use a device with a working camera.',NotReadableError:'Camera is busy. Close other camera apps, then try again.'};setCameraError(messages[error?.name]||'Unable to open the live camera. Please try again.');if(opener){opener.disabled=false;opener.textContent='Try camera again';}}
    }
    function captureLivePhoto(){const video=document.getElementById('driver-camera-video');if(page!=='camera'||!cameraReady||!cameraStream?.getVideoTracks().some(track=>track.readyState==='live')||!video||!video.videoWidth||!video.videoHeight||video.readyState<2){setCameraError('Wait for the live camera before taking a photo.');return;}
      try{const canvas=document.createElement('canvas'),scale=Math.min(1,960/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);const src=canvas.toDataURL('image/jpeg',0.82);if(!src.startsWith('data:image/jpeg;base64,')||src.length<100)throw Error('Empty capture');cameraImage={src,kind:cameraKind,at:Date.now(),dutyId:activeTripId};stopCamera();render(true);}catch{setCameraError('Could not capture a clear frame. Open the camera and try again.');}}
    function useLivePhoto(){const d=DUTIES.find(x=>x.id===activeTripId);if(!d||page!=='camera'||getFlow(d.id).stage!==0||!cameraImage||cameraImage.dutyId!==d.id||cameraImage.kind!==cameraKind||!startReady(d))return;const kind=cameraKind;photoRecord(d.id)[kind]=cameraImage;getFlow(d.id)[kind==='selfie'?'selfieAt':'carAt']=cameraImage.at;cameraImage=null;persist();if(kind==='selfie'){void openLiveCamera('car');}else{stopCamera();page='trip';render(true);}}
    document.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;if(action==='camera-open')void openLiveCamera(button.dataset.kind);if(action==='camera-retry'||action==='camera-retake')void openLiveCamera(cameraKind);if(action==='camera-capture')captureLivePhoto();if(action==='camera-use')useLivePhoto();if(action==='camera-back'){stopCamera();cameraImage=null;page='trip';render(true);}});
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&(cameraStream||cameraOpening)){stopCamera();if(page==='camera'&&!cameraImage){cameraError='Camera paused. Open the camera again to continue.';render();}}});
    window.addEventListener('pagehide',()=>{stopCamera();livePhotos.clear();});
    // This prototype records requests locally. Production decisions must come from NESAM admin.
    function isCancelled(flow){return flow?.cancellation?.status==='approved';}
    function cancellationPending(flow){return flow?.cancellation?.status==='pending';}
    function cancellationQuote(d,f,requestedAt=state.clock){
      const pickupAt=Date.parse(d.start),acceptedAt=f.acceptedAt;
      if(![pickupAt,acceptedAt,requestedAt].every(Number.isFinite)||requestedAt<acceptedAt)return null;
      const lastMinute=requestedAt>=pickupAt-4*60*60*1000;
      const withinGrace=requestedAt<=acceptedAt+4*60*60*1000;
      return{amount:lastMinute?1000:withinGrace?0:500,rule:lastMinute?'Within 4 hours of pickup':withinGrace?'Within 4 hours of accepting':'More than 4 hours after accepting',requestedAt,pickupAt,acceptedAt};
    }
    function cancellationReason(key){return({vehicle:'Vehicle breakdown',health:'Health issue',emergency:'Personal emergency',other:'Other reason'})[key]||'Other reason';}
    function cancellationPolicy(){return `<div class="nx-policy"><div class="nx-policy-title">Cancellation policy</div><div><span>Pickup in 4 hours or less</span><strong>₹1,000</strong></div><div><span>Pickup more than 4 hours away · cancel within 4 hours of acceptance</span><strong>₹0</strong></div><div><span>Pickup more than 4 hours away · cancel after 4 hours of acceptance</span><strong>₹500</strong></div><p>Valid reasons may be waived by NESAM admin. The last-4-hours rule takes priority over the acceptance grace period.</p></div>`;}
    function openCancellationPolicy(){openDialog('NESAM duty terms','Cancellation & waiver',cancellationPolicy()+`<div class="info-note">${icon('shield')}Charges are based on the time your request is submitted. Admin review time does not increase the quoted penalty.</div>`,`<button class="button primary full" data-action="close-dialog">Understood ${icon('check')}</button>`);}
    function tripHelpEntry(d,f){
      if(f.stage>=6)return '';
      const label=cancellationPending(f)?'Request help':f.stage===0?'Help / Request Cancellation':'Trip help / Call office';
      return `<button type="button" class="nx-trip-help nx-trip-help-top" data-action="trip-help" data-id="${d.id}" aria-haspopup="dialog" aria-label="${f.stage===0?'Help and request cancellation for this duty':'Call NESAM office for trip changes or urgent help'}">${icon('help')}<span>${label}</span></button>`;
    }
    function openTripHelp(id){
      const d=DUTIES.find(x=>x.id===id);if(!d||!state.assigned.includes(id))return;
      const f=getFlow(id),pending=cancellationPending(f),started=f.stage>0&&!isCancelled(f),canRequest=f.stage===0&&!isCancelled(f)&&!pending&&f.cancellation?.status!=='declined';
      const intro=started?'For changes after starting your duty, call NESAM office. Our team will handle the next steps.':pending?'Your request is with NESAM office. The duty remains assigned until admin approves the cancellation.':f.cancellation?.status==='declined'?'Your cancellation request was declined. The duty remains assigned. Call NESAM office to discuss the next steps.':'Before trip start, you can send a cancellation request in the app.';
      openDialog(d.id,started?'Trip started · Office help':'Help & Cancellation',`<p class="nx-help-intro">${intro}</p>${canRequest?`<button type="button" class="nx-help-choice nx-request-choice" data-action="cancel-request-open" data-id="${id}"><span>${icon('document')}Request cancellation<small>Select reason → Send Request → Admin review</small></span>${icon('chevron')}</button><ul class="nx-help-rules"><li>Any potential penalty is shown before you submit.</li><li>The duty is cancelled only after admin approval.</li><li>Admin may waive the penalty for a valid reason.</li></ul>`:''}${!started?`<button type="button" class="nx-help-choice" data-action="cancellation-policy"><span>${icon('shield')}Cancellation policy</span>${icon('chevron')}</button>`:''}`,`<a class="button ${started?'primary':'secondary'} full nx-office-call" href="tel:+919025099990" aria-label="Call NESAM office on 90250 99990">${icon('phone')}Call NESAM Office</a><p class="nx-office-number">90250 99990</p><p class="nx-office-note">${started?'Call the office for trip changes or an urgent issue.':'For an immediate or urgent issue, call the office.'}</p>`);
    }
    function openCancellationRequest(id){const d=DUTIES.find(x=>x.id===id);if(!d||!state.assigned.includes(id))return;const f=getFlow(id);if(f.stage!==0||isCancelled(f)||f.cancellation?.status==='declined'){openTripHelp(id);return;}if(cancellationPending(f)){openTrip(id);return;}const quote=cancellationQuote(d,f);if(!quote){toast('Contact NESAM to review this duty.');return;}
      openDialog(d.id,'Request cancellation',`<div class="nx-cancel-fee"><div><span>Potential penalty</span><strong id="cancel-penalty-value">${money(quote.amount)}</strong></div><p>${quote.amount?'Valid reasons can be waived after admin review.':'No penalty in this window. Admin approval is still required.'}</p></div><div class="nx-cancel-window">${icon('clock')}${quote.rule}</div><form id="cancel-request-form" data-id="${id}" data-quoted-penalty="${quote.amount}"><label class="nx-cancel-field" for="cancel-reason">Reason<select id="cancel-reason" required><option value="">Select a reason</option>${['vehicle','health','emergency','other'].map(key=>`<option value="${key}">${cancellationReason(key)}</option>`).join('')}</select></label><label class="nx-cancel-field" for="cancel-details">What happened?<textarea id="cancel-details" rows="3" maxlength="500" minlength="10" required placeholder="Explain the issue so NESAM can review your request."></textarea></label><p class="nx-cancel-explain"><strong>Admin approval is required to cancel this duty.</strong>Your duty stays assigned until approval. Selecting a reason does not automatically waive a charge; admin may waive it after review.</p><div id="cancel-form-error" class="nx-cancel-error" role="alert"></div><button class="button primary full" type="submit">Send Request ${icon('arrow')}</button></form><details class="nx-cancel-policy"><summary>View cancellation policy</summary>${cancellationPolicy()}</details>`,`<a class="button secondary full nx-office-call" href="tel:+919025099990">${icon('phone')}Call NESAM Office</a><p class="nx-office-note">Immediate or urgent issue? Call 90250 99990.</p>`);
    }
    function submitCancellation(form){const d=DUTIES.find(x=>x.id===form.dataset.id);if(!d||!state.assigned.includes(d.id))return;const f=getFlow(d.id);if(f.stage!==0||f.cancellation)return;const error=document.getElementById('cancel-form-error'),reason=document.getElementById('cancel-reason').value,details=document.getElementById('cancel-details').value.trim();error.textContent='';if(!form.reportValidity()||!['vehicle','health','emergency','other'].includes(reason)||details.length<10){error.textContent='Select a reason and describe the issue in at least 10 characters.';return;}const quote=cancellationQuote(d,f);if(!quote){error.textContent='Unable to quote this request. Contact NESAM support.';return;}
      if(Number(form.dataset.quotedPenalty)!==quote.amount){form.dataset.quotedPenalty=String(quote.amount);document.getElementById('cancel-penalty-value').textContent=money(quote.amount);error.textContent='The cancellation window changed. Review the updated penalty, then submit again.';return;}
      f.cancellation={status:'pending',reason,details:details.slice(0,500),requestedAt:quote.requestedAt,acceptedAt:quote.acceptedAt,pickupAt:quote.pickupAt,quotedPenalty:quote.amount,finalPenalty:null,reviewedAt:null,adminReason:''};persist();dialog.close();activeTripId=d.id;page='trip';render(true);toast('Request sent. Await office review; the duty remains assigned.');
    }
    function cancellationStatus(d,f){const c=f.cancellation;return `<section class="nx-panel nx-request-status"><div class="nx-status amber">${icon('clock')}${c.status==='declined'?'Cancellation request declined':'Cancellation under review'}</div><h3>${c.status==='declined'?'Contact NESAM for help':'Office review pending'}</h3><p>${c.status==='declined'?'This duty remains assigned. No cancellation penalty has been deducted.':'The duty remains assigned. Call NESAM if the pickup is approaching.'}</p><div class="nx-row"><span>Reason</span><strong>${cancellationReason(c.reason)}</strong></div><div class="nx-row"><span>Requested</span><strong>${dateText(c.requestedAt,{hour:'2-digit',minute:'2-digit'})} IST</strong></div><div class="nx-row"><span>${c.status==='declined'?'Cancellation charge':'Potential penalty'}</span><strong>${money(c.status==='declined'?0:c.quotedPenalty)}</strong></div><p class="nx-note">${c.status==='declined'?esc(c.adminReason):'No wallet deduction during review. Valid reasons may be waived.'}</p><a class="nx-button" style="margin-top:16px" href="tel:+919025099990">${icon('phone')}Call NESAM support</a></section>`;}
    function cancelledRecords(){return DUTIES.filter(d=>state.assigned.includes(d.id)&&isCancelled(getFlow(d.id))).map(d=>({duty:d,flow:getFlow(d.id)}));}
    function cancellationSummary(d,f){const c=f.cancellation,waived=c.finalPenalty===0;return `<div class="trip-flow"><button class="trip-back" data-page="trips" data-tab="cancelled">${icon('chevron')}My Trips</button><div class="nx-trip-meta">${d.id}</div><h2 class="nx-route-title">${d.from} → ${d.to}</h2><section class="nx-panel" style="margin-top:20px"><span class="badge neutral">Cancelled by NESAM</span><h3 class="nx-heading" style="margin-top:16px">Duty cancelled</h3><p class="nx-copy">${esc(c.adminReason)}</p><div class="nx-row"><span>Cancellation penalty</span><strong>${money(c.finalPenalty)}</strong></div><div class="nx-status ${waived?'':'amber'}" style="margin-top:14px">${icon('shield')}${waived?'No penalty · approved by NESAM':'Admin-approved debit recorded in your wallet'}</div><div class="nx-actions"><button class="nx-button primary" data-page="home">Browse available duties ${icon('arrow')}</button></div></section></div>`;}
    function penaltyTotal(){return DUTIES.reduce((sum,d)=>{const c=state.flows[d.id]?.cancellation;return sum+(c?.status==='approved'&&Number.isFinite(c.finalPenalty)?c.finalPenalty:0);},0);}
    function approvedBalance(){return 4850-penaltyTotal();}
    function cancellationLedger(){const records=DUTIES.map(d=>({d,c:state.flows[d.id]?.cancellation})).filter(x=>x.c);if(!records.length)return'';return `<section class="panel page-card"><div class="card-heading"><div><h2>Cancellation reviews</h2><p>Only admin-approved charges affect your balance</p></div>${icon('shield')}</div>${records.map(({d,c})=>`<div class="ledger-item"><div class="ledger-icon">${icon('trip')}</div><div><strong>${d.from} → ${d.to}</strong><small>${c.status==='pending'?'Under review · no debit':c.status==='declined'?'Request declined · no debit':c.finalPenalty?'Penalty applied by NESAM':'No penalty · approved by NESAM'}</small></div><strong>${c.status==='approved'&&c.finalPenalty?'-'+money(c.finalPenalty):c.status==='pending'?money(c.quotedPenalty):money(0)}</strong></div>`).join('')}</section>`;}
    // Simulates a trusted admin response for integration tests; there is no driver control for this.
    function applyAdminCancellationUpdate(id,decision){const f=state.flows[id],c=f?.cancellation;if(!c||c.status!=='pending'||!['waive','apply','decline'].includes(decision))return false;c.reviewedAt=state.clock;if(decision==='decline'){c.status='declined';c.finalPenalty=0;c.adminReason='NESAM declined the cancellation request. Contact support for assistance.';}else{c.status='approved';c.finalPenalty=decision==='waive'?0:c.quotedPenalty;c.adminReason=decision==='waive'?'Reason accepted. NESAM waived the cancellation penalty.':'Cancellation approved. The charge follows the policy shown when you requested.';livePhotos.delete(id);if(activeTripId===id&&['trip','camera'].includes(page)){stopCamera();cameraImage=null;page='trip';}}persist();render();return true;}
    document.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const{action,id}=button.dataset;if(action==='trip-help')openTripHelp(id);if(action==='cancel-request-open')openCancellationRequest(id);if(action==='cancellation-policy')openCancellationPolicy();});
    document.addEventListener('submit',event=>{if(event.target.id==='cancel-request-form'){event.preventDefault();submitCancellation(event.target);}});

    document.addEventListener('click',event=>{
      const button=event.target.closest('button[data-action],button[data-page]');if(!button||button.disabled)return;
      if(button.dataset.page){goPage(button.dataset.page,button.dataset.tab);return;}
      const {action,id,value}=button.dataset;
      if(action==='toggle-online'){state.online=!state.online;persist();if(page==='camera')updateNav();else render();const toggle=document.querySelector('[data-action="toggle-online"]');if(toggle)toggle.focus({preventScroll:true});toast(state.online?'You’re online. Available duties are ready to view.':'You’re offline. Your assigned trips stay available.');}
      else if(action==='view-duty')openDuty(id);
      else if(action==='accept-duty')acceptDuty(id);
      else if(action==='close-dialog')dialog.close();
      else if(action==='notifications')openNotifications();
      else if(action==='support')openSupport();
      else if(action==='trip-tab'){tripTab=value;render();main.querySelector(`[data-value="${value}"]`).focus({preventScroll:true});}
      else if(action==='earnings-period'){earningsPeriod=value;render();main.querySelector(`[data-value="${value}"]`).focus({preventScroll:true});}
      else if(action==='today-earnings'){earningsPeriod='today';goPage('earnings');}
      else if(action==='wallet-breakdown')openDialog('Sample ledger','Wallet balance breakdown',`<div class="detail-line"><span>Opening balance</span><strong>${money(1600)}</strong></div><div class="detail-line"><span>Last approved trip settlements</span><strong>+${money(3250)}</strong></div><div class="detail-list">${penaltyTotal()?`<div class="detail-line"><span>Admin-approved cancellation charges</span><strong>-${money(penaltyTotal())}</strong></div>`:''}<div class="detail-line"><span>Current balance</span><strong style="font-size:22px">${money(approvedBalance())}</strong></div></div><div class="info-note">${icon('info')}This is a sample ledger. No real funds or payout requests are connected.</div>`,`<button class="button primary full" data-action="close-dialog">Got it ${icon('check')}</button>`);
      else if(action==='settlement'){const t=COMPLETED.find(x=>x.id===id);if(t)openDialog(t.id,'Trip settlement receipt',`<div class="detail-payout"><small>Driver payout credited</small><strong>${money(t.amount)}</strong></div><h3 style="font-size:16px">${t.route}</h3><p style="font-size:11px;color:var(--muted);margin-top:6px">${t.time}</p><div class="detail-list"><div class="detail-line"><span>Status</span><strong>Completed · settled</strong></div><div class="detail-line"><span>Credit destination</span><strong>Driver wallet</strong></div></div><div class="info-note">${icon('info')}Sample settlement receipt for this UI preview.</div>`,`<button class="button primary full" data-action="close-dialog">Done ${icon('check')}</button>`);}
      else if(action==='pickup-address')openPickup(id);
      else if(action==='copy-address')copyAddress(id);
      else if(action==='refresh'){dutyFilter='all';render();toast('Sample duties refreshed. No live bookings are connected.');}
      else if(action==='toggle-notifications'){state.notificationsEnabled=!state.notificationsEnabled;persist();render();main.querySelector('[data-action="toggle-notifications"]').focus({preventScroll:true});toast(`Preview notification preference ${state.notificationsEnabled?'enabled':'disabled'}.`);}
      else if(action==='reset')resetPreview();
      else if(action==='confirm-reset'){stopCamera();livePhotos.clear();cameraImage=null;state=freshState();activeTripId=null;dutyFilter='all';tripTab='upcoming';earningsPeriod='week';persist();dialog.close();page='home';render();window.scrollTo({top:0,behavior:'instant'});toast('Preview reset to the original sample data.');}
    });
    document.addEventListener('change',event=>{if(event.target.id==='duty-filter'){dutyFilter=event.target.value;render();document.getElementById('duty-filter').focus({preventScroll:true});}});
    dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
    dialog.addEventListener('close',()=>{if(lastTrigger&&lastTrigger.isConnected)lastTrigger.focus({preventScroll:true});else main.focus({preventScroll:true});});
    render();
